[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coursera-helper"
version = "0.12.3"
description = "Script for downloading Coursera.org videos and naming them"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "LGPL" }
authors = [
  { name = "Spiros Keverkloglou", email = "spiros.kraz@hotmail.com" }
]
dependencies = [
  "beautifulsoup4>=4.1.3",
  "requests>=2.10.0",
  "six>=1.5.0",
  "urllib3>=1.23",
  "pyasn1>=0.1.7",
  "keyring>=4.0",
  "configargparse>=0.12.0",
  "attrs==18.1.0",
  "playwright>=1.38.0",
  "browser_cookie3>=0.19.1",
  "packaging>=20.0"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "mock>=1.0.1",
  "coverage>=3.7",
  "keyrings.alt",
  "tox",
  "build"
]

[project.urls]
Homepage = "https://github.com/krazator/coursera-helper"
Issues = "https://github.com/krazator/coursera-helper/issues"

[project.scripts]
coursera-helper = "coursera_helper.coursera_dl:main"

[tool.setuptools]
packages = ["coursera_helper"]
